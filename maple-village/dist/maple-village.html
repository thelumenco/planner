<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maple's village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2EEE7; --card:#F9F7F2; --edge:rgba(120,104,84,.13); --ink:#2F2B28; --soft:#8A8279; --faint:#B5ADA2;
  --navy:#2F3B73; --line:#3A2E28;
  --fox:#EE8B3A; --fox2:#D46A22; --cream:#FFF7EA; --sock:#4A3029;
  --peri:#C3CDEE; --peri2:#9AA9DD; --butter:#F6E3A1; --blush:#F4C7CF; --blushText:#C2505F; --oat:#EAE3D8;
  --peach:#F5C3A4; --sage:#B9D2A6; --sky:#BFD6E6; --moss:#9EBE8C; --moss2:#7C9F6C; --honey:#F3C969; --rose:#EFA3A6; --plum:#C3CDEE;
  --wash1:#F6E4D2; --wash2:#E0EAD8; --rule:#E4DDD2;
  --fibre:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.02 .14' numOctaves='3' seed='5'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .5  0 0 0 0 .44  0 0 0 -2.2 1.25'/></filter><rect width='240' height='240' filter='url(%23f)' opacity='.08'/></svg>");
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1C22; --card:#28252C; --edge:rgba(255,255,255,.07); --ink:#F1ECE5; --soft:#ABA29A; --faint:#6F675F;
    --navy:#BFC9F0; --oat:#3A3540; --rule:#3A3540; --wash1:#3E3330; --wash2:#2F3A30;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1C22; --card:#28252C; --edge:rgba(255,255,255,.07); --ink:#F1ECE5; --soft:#ABA29A; --faint:#6F675F;
  --navy:#BFC9F0; --oat:#3A3540; --rule:#3A3540; --wash1:#3E3330; --wash2:#2F3A30;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;color:var(--ink);background:var(--bg);font:16px/1.65 Mulish,"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:28px 22px 72px;display:grid;gap:36px}
@media (min-width:900px){.wrap{grid-template-columns:1fr 1fr;align-items:start;padding:56px 40px 96px;column-gap:64px}.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 32px)}}
.left,.right{display:grid;gap:32px;min-width:0}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);margin:0 0 14px}

/* paper cards + washi */
.card{position:relative;background-color:var(--card);background-image:var(--fibre);border:1px solid var(--edge);border-radius:6px;padding:30px 26px 26px;box-shadow:0 1px 2px rgba(80,60,40,.05),0 18px 34px -30px rgba(80,60,40,.45)}
.tape{position:absolute;top:-12px;left:50%;height:26px;width:104px;opacity:.82;z-index:2;mix-blend-mode:multiply;
  clip-path:polygon(2% 10%,9% 0,18% 8%,28% 2%,40% 9%,52% 1%,64% 8%,76% 2%,88% 9%,98% 3%,96% 50%,99% 94%,89% 99%,77% 91%,65% 100%,53% 92%,41% 100%,29% 92%,17% 99%,7% 91%,0 97%,3% 50%)}
:root[data-theme="dark"] .tape{mix-blend-mode:normal;opacity:.7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tape{mix-blend-mode:normal;opacity:.7}}
.tape.gingham{transform:translateX(-50%) rotate(-2deg);background:var(--peach)}
.tape.dots{transform:translateX(-30%) rotate(2deg);background-color:var(--peri);background-image:radial-gradient(circle,rgba(255,255,255,.85) 1.6px,transparent 2px);background-size:9px 9px;background-position:3px 4px}
.tape.stripe{transform:translateX(-70%) rotate(-3deg);background:repeating-linear-gradient(90deg,var(--sage) 0 5px,#CFE0C1 5px 9px)}
.tape.sky{transform:translateX(-50%) rotate(1.5deg);background-color:var(--sky);background-image:var(--fibre)}

/* header */
.head{display:flex;align-items:flex-end;gap:12px}
.title{margin:0 auto 0 0;font-family:"Klee One",serif;font-weight:600;font-size:clamp(2.1rem,8vw,2.8rem);line-height:1.1;letter-spacing:-.01em}
.title small{display:block;font-family:Mulish,sans-serif;font-weight:400;font-size:.95rem;letter-spacing:0;color:var(--soft);margin-top:6px}
.berries{font-family:"Klee One",serif;font-weight:600;font-size:1.5rem;display:flex;align-items:center;gap:6px;padding-bottom:4px}
.earn{min-height:1.5em;color:var(--fox2);font-size:.92rem;font-weight:600;margin:-22px 0 -10px}
/* scene */
.scene{position:relative;aspect-ratio:360/260;user-select:none}
.scene > svg{display:block;width:100%;height:100%;overflow:visible}
.props{position:absolute;inset:0;pointer-events:none}
.prop{position:absolute;font-size:clamp(20px,6vw,30px);transform:translate(-50%,-50%);line-height:1}
.scene button.pet{position:absolute;left:52%;top:36%;width:36%;height:54%;background:transparent;border:0;border-radius:40%}
.speech{position:absolute;left:0;top:4%;max-width:52%;margin:0;background:var(--card);color:var(--ink);
  border:1.5px solid var(--navy);border-radius:22px 22px 22px 6px/20px 22px 22px 6px;
  padding:12px 16px 13px;font-family:"Klee One",serif;font-weight:600;font-size:clamp(1rem,4.1vw,1.2rem);line-height:1.35;
  transform:rotate(-1deg);transform-origin:80% 100%;box-shadow:0 10px 24px -18px rgba(46,58,112,.5)}
.speech::after{content:"";position:absolute;right:14%;bottom:-11px;width:18px;height:18px;background:var(--card);
  border-right:1.5px solid var(--navy);border-bottom:1.5px solid var(--navy);transform:rotate(30deg) skewX(-12deg);border-radius:0 0 4px 0}
.speech.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:rotate(-1deg) scale(.8);opacity:.4}70%{transform:rotate(-1deg) scale(1.03)}100%{transform:rotate(-1deg) scale(1);opacity:1}}

/* fox motion */
#foxAll,#fHead,#fTail,#fBody,.eyesOpen,#napAll,#napBody{transform-box:view-box}
#fTail{transform-origin:78px 102px;animation:swish 3.2s ease-in-out infinite}
#fBody{transform-origin:60px 118px;animation:breathe 3.6s ease-in-out infinite}
#fHead{transform-origin:60px 76px;animation:headidle 7s ease-in-out infinite}
.eyesOpen{transform-origin:60px 50px;animation:blink 5s infinite}
#foxAll{transform-origin:60px 118px}
#napBody{transform-origin:80px 88px;animation:breathe 5.5s ease-in-out infinite}
#nap{display:none}
.sleeping #sit{display:none}.sleeping #nap{display:inline}
@keyframes swish{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
@keyframes headidle{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-5deg)}88%{transform:rotate(3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.fox-eat #fHead{animation:chomp .35s ease-in-out 6}
@keyframes chomp{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(4deg) translateY(4px)}}
.fox-cheer #foxAll,.fox-ball #foxAll{animation:hop .55s cubic-bezier(.3,.7,.4,1) 3}
@keyframes hop{0%,100%{transform:translateY(0) scaleY(1)}15%{transform:scaleY(.9)}50%{transform:translateY(-26px) scaleY(1.05)}}
.fox-cheer #fTail,.fox-ball #fTail,.fox-yarn #fTail{animation:swish .5s ease-in-out infinite}
.fox-nudge #fHead{animation:tilt 1.6s ease-in-out 2}
@keyframes tilt{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(-13deg)}}
.fox-brush #foxAll,.fox-bath #foxAll{animation:wiggle .4s ease-in-out 7}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
.fox-yarn #foxAll{animation:bat .45s ease-in-out 7}
@keyframes bat{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(6px) rotate(6deg)}}
.fox-hide #foxAll{animation:hide 4.2s ease-in-out 1}
@keyframes hide{0%{transform:translateY(0)}18%,72%{transform:translateY(98px)}80%{transform:translateY(82px)}86%{transform:translateY(86px)}100%{transform:translateY(0)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}
.twinkle:nth-child(2n){animation-delay:.8s}.twinkle:nth-child(3n){animation-delay:1.5s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
.steam{animation:steam 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes steam{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:.8;transform:translateY(-3px)}}
.p-food{animation:feed 2.2s ease-in forwards}
@keyframes feed{0%{left:40%;top:92%;opacity:0}15%{opacity:1}55%{left:65%;top:66%;transform:translate(-50%,-50%) scale(1)}100%{left:65%;top:66%;transform:translate(-50%,-50%) scale(0);opacity:0}}
.p-brush{animation:brushy 2.8s ease-in-out forwards}
@keyframes brushy{0%{left:60%;top:72%;opacity:0}10%{opacity:1}25%{left:82%;top:76%}40%{left:62%;top:82%}55%{left:82%;top:84%}70%{left:64%;top:76%}90%{opacity:1}100%{left:78%;top:78%;opacity:0}}
.p-bubble{animation:bub 2.6s ease-out forwards;font-size:clamp(14px,4vw,22px)}
@keyframes bub{0%{opacity:0;transform:translate(-50%,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-120px) scale(1.2)}}
.p-heart{animation:heart 1.8s ease-out forwards;font-size:clamp(14px,4vw,22px)}
@keyframes heart{0%{opacity:0;transform:translate(-50%,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-90px) scale(1.1)}}
.p-ball{animation:ball 1.7s linear forwards}
@keyframes ball{0%{left:20%;top:60%}20%{left:36%;top:88%}40%{left:50%;top:64%}60%{left:62%;top:88%}80%{left:68%;top:72%}100%{left:65%;top:60%;opacity:0}}
.p-yarn{animation:yarn 3.2s ease-in-out forwards}
@keyframes yarn{0%{left:30%;top:90%;transform:translate(-50%,-50%) rotate(0)}40%{left:52%;top:90%;transform:translate(-50%,-50%) rotate(300deg)}70%{left:46%;top:90%;transform:translate(-50%,-50%) rotate(200deg)}100%{left:54%;top:90%;transform:translate(-50%,-50%) rotate(400deg)}}
.p-z{animation:zz 2.4s ease-out infinite;font-family:"Klee One",serif;font-weight:600;color:var(--navy);font-size:clamp(18px,5vw,28px)}
@keyframes zz{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-46px)}}
.p-peek{animation:peek 4.2s ease forwards}
@keyframes peek{0%,15%{opacity:0}25%,70%{opacity:1}80%,100%{opacity:0}}
.p-fort{animation:fort 5s ease forwards;font-size:clamp(70px,22vw,120px)}
@keyframes fort{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%,85%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #fTail,#fBody,#fHead,.eyesOpen,.twinkle,.steam,#napBody{animation:none!important}
  .fox-cheer #foxAll,.fox-ball #foxAll,.fox-brush #foxAll,.fox-bath #foxAll,.fox-yarn #foxAll,.fox-hide #foxAll{animation-duration:.01s!important}
}


/* trackers */
.trackers{display:grid;gap:16px}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trow .lbl{font-family:"Klee One",serif;font-weight:600;font-size:1.05rem;width:50px}
.boxes{display:flex;gap:5px}
.box{width:22px;height:22px;border:1.5px solid var(--faint);border-radius:6px;background:transparent;padding:0;position:relative;transition:background .2s,border-color .2s}
.box.on{background:var(--sky);border-color:var(--sky)}
.box.step.on{background:var(--sage);border-color:var(--sage)}
.box.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--navy)}
.tnote{color:var(--soft);font-size:.88rem}
.stepform{display:none;gap:12px;align-items:center;flex-wrap:wrap}
.stepform.open{display:flex}

/* journal task page */
.journal{padding-top:34px}
.journal h1{font-family:"Klee One",serif;font-weight:600;font-size:clamp(1.85rem,6.6vw,2.3rem);line-height:1.2;margin:0 0 20px;letter-spacing:-.01em}
.journal .lbl{display:block;font-family:Mulish,sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--soft);margin:0 0 10px}
.ack{color:var(--moss2);font-size:.92rem;font-weight:600;margin:0 0 16px}
.bujo{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px}
.bujo li{display:grid;grid-template-columns:24px 1fr;align-items:baseline}
.bujo li::before{content:"•";font-weight:700;color:var(--faint)}
.bujo li.pep{font-family:"Klee One",serif;color:var(--soft)}
.bujo li.pep::before{content:"♡";color:var(--rose)}
.bujo li.first::before{content:"→";color:var(--navy)}
.hl{font-weight:700;background:linear-gradient(100deg,transparent 0,var(--butter) 3%,var(--butter) 96%,transparent 100%) 0 70%/100% 50% no-repeat;padding:0 3px;color:var(--ink)}
.stickers{margin:-6px 0 18px;display:flex;flex-wrap:wrap;gap:8px}
.sticker{font-size:.82rem;font-weight:600;background:var(--oat);border-radius:999px;padding:3px 12px;color:var(--ink)}
.checkin{font-family:"Klee One",serif;font-weight:600;font-size:1.1rem;margin:0 0 20px}
.actions{display:flex;flex-wrap:wrap;gap:14px 12px}
.btn{position:relative;border:0;padding:12px 30px;background:var(--peri);color:var(--navy);font-weight:700;font-size:1rem;line-height:1.2;transform:rotate(-.6deg);
  clip-path:polygon(1.5% 10%,6% 0,96% 3%,99.5% 0,97% 46%,100% 92%,94% 100%,4% 97%,0 100%,2.5% 52%);transition:filter .15s,transform .1s}
.btn:hover{filter:saturate(1.15) brightness(.98)}
.btn:active{transform:rotate(-.6deg) translateY(1px)}
.btn.primary::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--navy);margin-right:10px;vertical-align:1px}
.btn.yes{background:var(--butter);color:#3B3320;transform:rotate(.5deg)}
.btn.alt{background:var(--oat);color:var(--ink);transform:rotate(.4deg)}
.btn.warn{background:var(--blush);color:var(--blushText)}
.btn.small{padding:8px 20px;font-size:.92rem}
:root[data-theme="dark"] .btn.yes{color:#3B3320}
.timer{display:flex;align-items:center;gap:16px;margin:0 0 22px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--rule)}
.ring .fg{stroke:var(--peri2);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.timer .t{font-family:"Klee One",serif;font-weight:600;font-size:2rem;font-variant-numeric:tabular-nums;line-height:1}
.timer small{display:block;color:var(--soft);font-size:.85rem;margin-top:4px}
.note{background:var(--butter);color:#3B3320;padding:12px 16px;margin:0 0 22px;border-radius:4px;transform:rotate(-.5deg);display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.note button{margin-left:auto;background:none;border:0;font-weight:700;color:#3B3320;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
.saybtns{margin:0 0 24px}

/* care tray */
.tray h2{font-family:"Klee One",serif;font-weight:600;font-size:1.5rem;margin:0 0 18px;line-height:1.2}
.tabs{display:flex;gap:4px;margin-bottom:20px;padding:4px;background:var(--bg);border:1px solid var(--edge);border-radius:8px}
.tabs button{flex:1;border:0;border-radius:6px;background:none;padding:8px;font-weight:600;color:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 3px rgba(60,40,30,.12)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.item{border:1px solid var(--edge);background:var(--bg);border-radius:8px;padding:14px 6px 12px;display:grid;justify-items:center;gap:2px;text-align:center;line-height:1.3;transition:transform .12s,border-color .12s}
.item .e{font-size:1.7rem;line-height:1.3}
.item .n{font-size:.9rem;font-weight:600}
.item .c{font-size:.8rem;color:var(--soft)}
.item:not(:disabled):hover{border-color:var(--peri2);transform:translateY(-2px)}
.item:disabled{opacity:.4;cursor:not-allowed}

/* log + friendship */
.log ul{list-style:none;padding:0;margin:0 0 14px}
.log li{display:grid;grid-template-columns:24px 1fr auto;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule)}
.log li .sig{font-weight:700;color:var(--faint)}
.log li.done{color:var(--soft)}
.log li.done .t{text-decoration:line-through;text-decoration-color:var(--faint)}
.log li button{background:none;border:0;color:var(--soft)}
.key{color:var(--soft);font-size:.85rem;margin:16px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.row input,.stepform input{flex:1;min-width:110px;border:0;border-bottom:1.5px solid var(--rule);background:transparent;padding:6px 2px;outline-offset:2px}
.row input:focus,.stepform input:focus{border-bottom-color:var(--navy);outline:none}
.row input[type=number],.stepform input{flex:0 1 110px}
.hearts{font-size:1.2rem;letter-spacing:4px;color:var(--rose);margin:16px 0 4px}
.muted{color:var(--soft);font-size:.9rem;margin:8px 0 0}
details summary{cursor:pointer;list-style:none;font-family:"Klee One",serif;font-weight:600;font-size:1.3rem;line-height:1.3;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:Mulish,sans-serif;font-weight:400;color:var(--soft);font-size:1.3rem}
details[open] summary::after{content:"–"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- village ---------- */
:root{--grass:#E4ECD6;--grass2:#D3E0C2;--path:#EFE4CF;--path2:#E2D3B6;--wood:#C9A27E;--stone:#CFC8BE;--tree:#9EBE8C;--tree2:#7FA36E;--water:#BFD6E6;--skin:#F8DECD;--hair:#2A211D;--tank:#F2A290;--denim:#7D97C2;--tee:#6E9FD6;--pants:#F3CF5A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--grass:#2D3A2F;--grass2:#26322A;--path:#4A4038;--path2:#3E352E;--water:#3F5568;--stone:#5A544E}}
:root[data-theme="dark"]{--grass:#2D3A2F;--grass2:#26322A;--path:#4A4038;--path2:#3E352E;--water:#3F5568;--stone:#5A544E}
.mapcard{padding:12px}
.map{position:relative;aspect-ratio:520/640;touch-action:manipulation}
.map > svg{display:block;width:100%;height:100%;border-radius:4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.map .lab{font-family:"Klee One",serif;font-weight:600;font-size:15px;fill:var(--ink)}
.map [data-place]{cursor:pointer}
.map [data-place]:hover .hov{opacity:1}
.hov{opacity:0;transition:opacity .2s}
.mprops{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mprop{position:absolute;transform:translate(-50%,-50%);font-size:clamp(14px,3.6vw,20px);line-height:1;animation:heart 1.8s ease-out forwards}
.speech{position:absolute;left:0;top:0;max-width:min(56%,250px);width:max-content;margin:0;background:var(--card);color:var(--ink);
  border:1.5px solid var(--navy);border-radius:18px;padding:9px 14px 10px;font-family:"Klee One",serif;font-weight:600;
  font-size:clamp(.82rem,3.3vw,1rem);line-height:1.3;transform:translate(-50%,-100%);box-shadow:0 10px 24px -18px rgba(46,58,112,.5);z-index:3;pointer-events:none}
.speech::after{content:"";position:absolute;left:var(--tail,50%);bottom:-8px;width:13px;height:13px;margin-left:-7px;background:var(--card);
  border-right:1.5px solid var(--navy);border-bottom:1.5px solid var(--navy);transform:rotate(45deg);border-radius:0 0 3px 0}
.speech.below{transform:translate(-50%,0)}
.speech.below::after{bottom:auto;top:-8px;transform:rotate(225deg)}
.speech.pop{animation:pop2 .35s ease}
@keyframes pop2{0%{scale:.85;opacity:.4}70%{scale:1.03}100%{scale:1;opacity:1}}
.speech.small{font-size:.85rem;padding:4px 10px 5px;border-radius:12px;max-width:none;white-space:nowrap}
.speech[hidden]{display:none}
.ch .legL,.ch .legR,.ch .armL,.ch .armR{transform-box:fill-box;transform-origin:50% 0}
.ch.walk .legL,.ch.walk .armR{animation:swingA .3s ease-in-out infinite alternate}
.ch.walk .legR,.ch.walk .armL{animation:swingB .3s ease-in-out infinite alternate}
.ch.run .legL,.ch.run .armR{animation-duration:.18s}.ch.run .legR,.ch.run .armL{animation-duration:.18s}
@keyframes swingA{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes swingB{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
.ch.walk .bob{animation:cbob .3s ease-in-out infinite alternate}
@keyframes cbob{from{transform:translateY(0)}to{transform:translateY(-1.8px)}}
.pony{transform-box:fill-box;transform-origin:0% 15%;animation:pony 2.6s ease-in-out infinite}
.ch.walk .pony{animation-duration:.6s}
@keyframes pony{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}
.mtail{transform-box:fill-box;transform-origin:0% 80%;animation:pony 2.2s ease-in-out infinite}
#mmaple .curl{display:none}
#mmaple.sleep .stand{display:none}#mmaple.sleep .curl{display:inline}
#mmaple.hop .bob{animation:mhop .45s ease 3}
@keyframes mhop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.qmark{animation:qbob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes qbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.smoke{animation:steam 3.2s ease-in-out infinite;transform-box:fill-box}
.sprout{transform-box:fill-box;transform-origin:50% 100%;animation:grow .6s ease-out}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
.ripple{animation:tw 3s ease-in-out infinite}
.maphint{color:var(--soft);font-size:.85rem;text-align:center;margin:10px 0 0}
.portrait{margin:-6px -8px 10px}
.log li{grid-template-columns:30px 1fr auto}
.log li .pl{font-size:1rem}
.log li .next{font-size:.8rem;font-weight:700;color:var(--navy);background:var(--peri);border:0;border-radius:999px;padding:2px 10px}
.log li.cur .t{font-weight:700}
@media (prefers-reduced-motion:reduce){.ch *, .qmark, .pony, .mtail, .smoke, .ripple{animation:none!important}}
/* ---------- stage 2: scenes ---------- */
@media (min-width:900px){.left{position:static}}
.scenename{font-family:"Klee One",serif;font-weight:600;font-size:1.05rem;margin:2px 4px 8px;color:var(--soft);display:flex;justify-content:space-between}
#world{transition:opacity .22s ease}
#world.fading{opacity:0}
.map [data-spot],.map [data-exit],.map [data-plot]{cursor:pointer}
.map [data-spot]:hover .hov,.map [data-exit]:hover .hov,.map [data-plot]:hover .hov{opacity:1}
.ctx h2{font-family:"Klee One",serif;font-weight:600;font-size:1.5rem;margin:0 0 6px;line-height:1.2}
.ctx .sub{color:var(--soft);font-size:.92rem;margin:0 0 18px}
.ctx .tabs{margin-bottom:18px}
.shop .item .c b{color:var(--navy)}
.qlist{list-style:none;padding:0;margin:0 0 6px}
.qlist li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule)}
.qlist li small{display:block;color:var(--soft);font-size:.82rem}
.qlist li.done{color:var(--soft);text-decoration:line-through}
.qlist li.cur b::after{content:" ← now";color:var(--fox2);font-size:.8rem;font-weight:700}
.next{font-size:.8rem;font-weight:700;color:var(--navy);background:var(--peri);border:0;border-radius:999px;padding:3px 12px}
.plotbar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin:6px 0 14px}
.plotbar i{display:block;height:100%;background:var(--moss)}
.seedrow{display:flex;flex-wrap:wrap;gap:10px}
.item .cnt{position:absolute;top:6px;right:8px;font-size:.75rem;font-weight:700;color:var(--soft)}
.item{position:relative}
.ready{animation:tw 1.6s ease-in-out infinite}
</style>
